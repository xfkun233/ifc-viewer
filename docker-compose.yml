services:
  mysql:
    image: mysql:8.4
    container_name: ifc-viewer-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ifc_viewer
      MYSQL_USER: ifc_user
      MYSQL_PASSWORD: ifc_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - '3307:3306'
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-uroot', '-proot_password']
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - ifc-viewer-mysql-data:/var/lib/mysql

volumes:
  ifc-viewer-mysql-data:
